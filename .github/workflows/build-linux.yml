name: Build Linux

on:
  workflow_dispatch:
  push:
    branches: [v2.6.4-fixed]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.8
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libmpv-dev libsecret-1-dev \
            libjsoncpp-dev liblzma-dev libkeybinder-3.0-dev \
            libwebkit2gtk-4.1-dev

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Linux release
        run: flutter build linux --release

      - name: Bundle .env asset
        run: cp .env build/linux/x64/release/bundle/data/flutter_assets/.env

      - name: Package bundle
        run: |
          cd build/linux/x64/release/bundle
          mv azyx Azyx-linux-v2.6.4-fixed
          cd ..
          zip -r "$GITHUB_WORKSPACE/Azyx-Linux-x64.zip" bundle/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Azyx-Linux-x64.zip
          path: Azyx-Linux-x64.zip
          retention-days: 30